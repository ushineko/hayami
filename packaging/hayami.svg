<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="hayami">
  <!-- The panel itself: stacked cards read at a glance (早見). Three bars and
       a rounded square, and nothing else, so the icon survives a 16px taskbar
       where any detail below about 4px at this viewBox turns to mush.
       The bars are different lengths because the readings are: a panel of
       equal bars would read as a menu rather than as measurements. -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#2f4858"/>
  <rect x="14" y="17" width="36" height="7" rx="3.5" fill="#f4f1de"/>
  <rect x="14" y="28.5" width="24" height="7" rx="3.5" fill="#86bbd8"/>
  <rect x="14" y="40" width="30" height="7" rx="3.5" fill="#f4f1de" opacity="0.55"/>
</svg>
