# hayami's installer, which fynstall (github.com/ushineko/fynstall) builds
# from this file: one self-contained program per platform that installs both
# panels and needs no toolchain (spec 059).
#
#   .\scripts\installer_windows.ps1        builds the programs, then this
#
# The result is in dist/. Started from the desktop it is a wizard; from a
# terminal it asks there, and --yes installs with the defaults.
app:
  id: io.ushineko.hayami
  name: hayami
  # VERSION's, and a test holds the two together.
  version: 0.11.6
  publisher: ushineko
  # Drawn from the panel's own SVG when the installer is built (spec 053).
  icon: dist/hayami.png
  licence: LICENSE

install:
  dir:
    user: "{programs}/hayami"

payload:
  # In bin/, not beside the uninstaller: the directory of a program on PATH
  # goes on PATH on Windows, and a program named "uninstall" does not belong
  # there.
  - src: hayami{exe}
    dst: bin/hayami{exe}
  - src: hayami-tui{exe}
    dst: bin/hayami-tui{exe}

integration:
  path_links:
    - bin/hayami{exe}
    - bin/hayami-tui{exe}
  desktop:
    # The entry's ID is the app ID, by default: a Wayland compositor finds
    # the window's icon through it.
    - name: hayami
      generic_name: Glance panel
      comment: Peripheral batteries, bandwidth, cooler and usage, read at a glance
      exec: bin/hayami{exe}
      categories: [Utility, System, Monitor]
      keywords: [battery, peripheral, mouse, headset, bandwidth, network, temperature, cooler, usage, panel, glance]
      startup_notify: true
      # A glance panel is there when the desktop is.
      autostart: true
  # The settings are the person's, and outlive an uninstall and an upgrade.
  keep_on_uninstall:
    - "{config}/hayami"

parameters:
  # Set by the sensors page of the installer's own code (installer/), so the
  # Settings page has no field for it. On the command line: --sensors=yes.
  # "no" unless a person says otherwise: LibreHardwareMonitor is a second
  # program that runs as an administrator and loads a kernel driver.
  - name: sensors
    label: Set up LibreHardwareMonitor
    description: "yes installs and configures LibreHardwareMonitor, where the panel reads the processor's temperature on Windows"
    default: "no"
  # Set by the network page. On the command line: --network=yes. "no" unless
  # a person says otherwise: the helper is a Windows service, and installing
  # one takes an administrator.
  - name: network
    label: Install the network helper
    description: "yes installs hayami's network helper, the service the bandwidth card's list of programs is read from on Windows"
    default: "no"

ui:
  launch: bin/hayami{exe}
  # A glance panel is there when the desktop is: an install starts it unless
  # a person says no, so an upgrade, which had to stop it, brings it back.
  launch_default: true

# hayami's own installer code: the pages that check for LibreHardwareMonitor
# and for the network helper and offer to set each up, and the hooks that do
# it, that stop the panel before an uninstall and that remove the helper.
extension: ./installer
