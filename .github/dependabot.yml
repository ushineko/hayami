# Keeps the pinned Actions and the Go modules current (spec 075). Weekly, and
# grouped, so a week's updates are one pull request per ecosystem, reviewed
# and merged like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      modules:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
