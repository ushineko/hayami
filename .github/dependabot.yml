# Keeps the pinned Actions and the Go modules current (spec 075). Weekly, and
# grouped, so a week's updates are one pull request per ecosystem, reviewed
# and merged like any other. A version is a week old before it is proposed: a
# bad release is usually found and pulled by then (spec 080). Security updates
# do not wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      modules:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
