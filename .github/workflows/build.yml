name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The Go every job builds with: the newest patch release of this line, looked
# up on each run, so a release is not built with a standard library whose
# vulnerabilities are already fixed. go.mod's `go` line is the minimum the
# code needs, 1.26.0, and releases were built with exactly that until 0.9.10.
# It is not a `toolchain` line in go.mod because the linter refuses a module
# that names a newer Go than the one the linter was built with (see the
# Makefile's LINT_GO_TOOLCHAIN).
env:
  GO_VERSION: "1.27.x"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The desktop panel is a Fyne window and needs the X and GL headers to
      # build at all. The terminal panel does not, which is why it is a
      # separate binary and is built with CGO off below.
      # Fyne over GLFW: OpenGL, X11 and Wayland headers. This Fyne builds GLFW
      # with both back ends, so the Wayland ones are not optional even on a
      # runner that has no display at all. tmux is for the usage pane test,
      # which skips without it: a terminal is what that claim is made against.
      - name: Install the window's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            tmux

      # Two binaries reached main in one day -- a 35 MB test build and a 20 MB
      # hayami-tui -- both by `git add -A`, and the second slipped past the
      # .gitignore line written to stop the first. An ignore file only governs
      # what is untracked and can be negated by accident; this cannot.
      - name: No binaries in the repository
        run: make check-no-binaries

      - name: Test
        run: go test -race ./...

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # A terminal panel that needs a display library is a terminal panel with
      # a bug. Asserting it here is cheaper than finding it on a server.
      - name: The terminal panel builds without cgo
        run: CGO_ENABLED=0 go build ./cmd/hayami-tui

      # Spec 063. The Linux installers, built by fynstall from fynstall.yaml
      # as the Windows ones are below. The builder is run from the module, at
      # the version go.mod requires.
      - name: Build the installers
        run: make installer

      # Run, not only built: each says its version, and the command-line one
      # lists the whole plan and changes nothing. The wizard is not opened:
      # the runner has no display.
      - name: The installers run
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          "dist/hayami-$v-linux-amd64-cli-installer" --version | grep -F "hayami $v installer"
          "dist/hayami-$v-linux-amd64-cli-installer" --dry-run --yes
          "dist/hayami-$v-linux-amd64-installer" --version | grep -F "hayami $v installer"

      # And installed: into a home of the test's own, over a panel that is
      # running, and uninstalled again. Skipped by `go test ./...` above,
      # which has no installer to run.
      - name: The installer installs and uninstalls
        run: HAYAMI_INSTALLERS="$PWD/dist" go test -count=1 -run TestTheLinuxInstaller ./tests/structure

  # Spec 033. Both panels build and every test passes on Windows. The desktop
  # panel needs cgo; the runner image carries a mingw gcc on PATH.
  windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -tags migrated_fynedo ./...

      # The icon and the version Explorer shows (spec 053): the same script the
      # installer runs, so CI builds what a person installs.
      - name: Windows resources
        shell: pwsh
        run: ./scripts/winres.ps1

      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=1 go build -tags migrated_fynedo -ldflags "-H windowsgui" -o hayami.exe ./cmd/hayami
          CGO_ENABLED=0 go build -o hayami-tui.exe ./cmd/hayami-tui

      # Spec 059. The installer is built by fynstall, and against the fynstall
      # go.mod requires, so the builder is installed at that version and the
      # two cannot drift.
      - name: Install fynstall, at the version go.mod requires
        shell: bash
        run: go install "github.com/ushineko/fynstall/cmd/fynstall@$(go list -m -f '{{.Version}}' github.com/ushineko/fynstall)"

      # What a release carries: the installer with the wizard, a program with
      # a window so that no console shows before it, and the command-line-only
      # one for a terminal. The script builds both panels again, with the
      # version stamped in, as it does on a desk.
      - name: Build the installers
        shell: pwsh
        run: ./scripts/installer_windows.ps1 -Fynstall (Join-Path (go env GOPATH) "bin\fynstall.exe") -Windowed -WithCliOnly

      # Run, not only built: each says its version, and the command-line one
      # lists the whole plan and changes nothing.
      - name: The installers run
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          "dist/hayami-$v-windows-amd64-cli-installer.exe" --version | grep -F "hayami $v installer"
          "dist/hayami-$v-windows-amd64-cli-installer.exe" --dry-run --yes
          "dist/hayami-$v-windows-amd64-installer.exe" --version | grep -F "hayami $v installer"

      - uses: actions/upload-artifact@v4
        with:
          name: hayami-windows-installers
          path: |
            dist/*-windows-amd64-installer.exe
            dist/*-windows-amd64-cli-installer.exe
          if-no-files-found: error

  # The Release is published here and never by hand. Pushing a v* tag is the
  # whole of the ceremony: the job checks the tag against VERSION, builds the
  # tarball and the Linux installers, takes the Windows installers the job
  # above built, and attaches them all.
  #
  # Linux amd64 and Windows amd64, for now. The desktop panel links against
  # the system's OpenGL and X11 or Wayland libraries, so another target means
  # a cross toolchain for each, and hayami is still experimental enough that
  # the AUR and the other architectures are a later problem.
  release:
    name: Release
    needs: [test, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install the window's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      # VERSION is the version of record. A tag that disagrees with it is a
      # release nobody can reason about afterwards, so it fails here rather
      # than shipping.
      - name: Check the tag matches VERSION
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Build the release tarball
        run: make release

      # After the tarball, for the same reason as the download below.
      - name: Build the Linux installers
        run: |
          make installer
          v="$(tr -d '[:space:]' < VERSION)"
          "dist/hayami-$v-linux-amd64-cli-installer" --version | grep -F "hayami $v installer"
          "dist/hayami-$v-linux-amd64-installer" --version | grep -F "hayami $v installer"

      # After the tarball, because `make release` empties dist/. The sums are
      # written again so the one file covers everything attached.
      - uses: actions/download-artifact@v4
        with:
          name: hayami-windows-installers
          path: dist

      - name: Add the installers to SHA256SUMS
        run: |
          cd dist
          ls -l
          sha256sum *.tar.gz *.exe *-linux-amd64-installer *-linux-amd64-cli-installer > SHA256SUMS
          cat SHA256SUMS

      # The notes are this version's changelog entry, not a list of commit
      # subjects: the entry is written for somebody deciding whether to
      # upgrade, the commit list for somebody who already has the diff.
      # GitHub's generated notes are kept underneath, so the "Full Changelog"
      # link still appears. The job fails when the entry is missing, which is
      # the check that the changelog was written before the tag was pushed.
      - name: Take the release notes from the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "### " v) == 1 { f = 1; next }
            f && /^### / { exit }
            f { print }
          ' README.md > dist/NOTES.md
          test -s dist/NOTES.md || { echo "no changelog entry for $ver in README.md"; exit 1; }
          echo "--- notes ---"; cat dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.exe
            dist/*-linux-amd64-installer
            dist/*-linux-amd64-cli-installer
            dist/SHA256SUMS
          body_path: dist/NOTES.md
          generate_release_notes: true
