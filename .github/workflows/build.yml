name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Nothing by default; each job says what it needs (spec 075). Actions are
# pinned by commit, not by tag, which whoever controls an Action's repository
# can move; Dependabot keeps the pins current, and
# tests/structure/actions_pinned_test.go fails a workflow that names one by tag.
permissions: {}

# The Go every job builds with: the newest patch release of this line, looked
# up on each run, so a release is not built with a standard library whose
# vulnerabilities are already fixed. go.mod's `go` line is the minimum the
# code needs, 1.26.0, and releases were built with exactly that until 0.9.10.
# It is not a `toolchain` line in go.mod because the linter refuses a module
# that names a newer Go than the one the linter was built with (see the
# Makefile's LINT_GO_TOOLCHAIN).
env:
  GO_VERSION: "1.27.x"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The desktop panel is a Fyne window and needs the X and GL headers to
      # build at all. The terminal panel does not, which is why it is a
      # separate binary and is built with CGO off below.
      # Fyne over GLFW: OpenGL, X11 and Wayland headers. This Fyne builds GLFW
      # with both back ends, so the Wayland ones are not optional even on a
      # runner that has no display at all. tmux is for the usage pane test,
      # which skips without it: a terminal is what that claim is made against.
      - name: Install the window's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            tmux

      # Two binaries reached main in one day -- a 35 MB test build and a 20 MB
      # hayami-tui -- both by `git add -A`, and the second slipped past the
      # .gitignore line written to stop the first. An ignore file only governs
      # what is untracked and can be negated by accident; this cannot.
      - name: No binaries in the repository
        run: make -f Makefile check-no-binaries

      - name: Test
        run: go test -race ./...

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # A terminal panel that needs a display library is a terminal panel with
      # a bug. Asserting it here is cheaper than finding it on a server.
      - name: The terminal panel builds without cgo
        run: CGO_ENABLED=0 go build ./cmd/hayami-tui

      # Spec 063. The Linux installers, built by fynstall from fynstall.yaml
      # as the Windows ones are below. The builder is run from the module, at
      # the version go.mod requires.
      - name: Build the installers
        run: make installer

      # Run, not only built: each says its version, and the command-line one
      # lists the whole plan and changes nothing. The wizard is not opened:
      # the runner has no display.
      - name: The installers run
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          "dist/hayami-$v-linux-amd64-cli-installer" --version | grep -F "hayami $v installer"
          "dist/hayami-$v-linux-amd64-cli-installer" --dry-run --yes
          "dist/hayami-$v-linux-amd64-installer" --version | grep -F "hayami $v installer"

      # And installed: into a home of the test's own, over a panel that is
      # running, and uninstalled again. Skipped by `go test ./...` above,
      # which has no installer to run.
      - name: The installer installs and uninstalls
        run: HAYAMI_INSTALLERS="$PWD/dist" go test -count=1 -run TestTheLinuxInstaller ./tests/structure

  # Every parser that reads what hayami does not control, fuzzed for ten
  # seconds each (spec 074). Its own job, so a fuzz run does not hold the
  # tests up; the packages it fuzzes are pure Go and need none of the
  # window's headers.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Fuzz each parser
        run: make fuzz FUZZTIME=10s

  # Spec 033. Both panels build and every test passes on Windows. The desktop
  # panel needs cgo; the runner image carries a mingw gcc on PATH.
  windows:
    name: Test on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -tags migrated_fynedo ./...

      # The icon and the version Explorer shows (spec 053): the same script the
      # installer runs, so CI builds what a person installs.
      - name: Windows resources
        shell: pwsh
        run: ./scripts/winres.ps1

      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=1 go build -tags migrated_fynedo -ldflags "-H windowsgui" -o hayami.exe ./cmd/hayami
          CGO_ENABLED=0 go build -o hayami-tui.exe ./cmd/hayami-tui

      # Spec 059. The installer is built by fynstall, and against the fynstall
      # go.mod requires, so the builder is installed at that version and the
      # two cannot drift.
      - name: Install fynstall, at the version go.mod requires
        shell: bash
        run: go install "github.com/ushineko/fynstall/cmd/fynstall@$(go list -m -f '{{.Version}}' github.com/ushineko/fynstall)"

      # What a release carries: the installer with the wizard, a program with
      # a window so that no console shows before it, and the command-line-only
      # one for a terminal. The script builds both panels again, with the
      # version stamped in, as it does on a desk.
      - name: Build the installers
        shell: pwsh
        run: ./scripts/installer_windows.ps1 -Fynstall (Join-Path (go env GOPATH) "bin\fynstall.exe") -Windowed -WithCliOnly

      # Run, not only built: each says its version, and the command-line one
      # lists the whole plan and changes nothing.
      - name: The installers run
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          "dist/hayami-$v-windows-amd64-cli-installer.exe" --version | grep -F "hayami $v installer"
          "dist/hayami-$v-windows-amd64-cli-installer.exe" --dry-run --yes
          "dist/hayami-$v-windows-amd64-installer.exe" --version | grep -F "hayami $v installer"

  # A warning is for a mistake. This is for intent: the object the network helper
  # loads is rebuilt from its source with pinned tools, in a pinned image, and has
  # to come out the same (spec 081). In this workflow so a tag cannot skip it.
  bpf-rebuilt:
    name: The BPF object is what its source builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild the object and compare it
        run: tools/bpf.sh check

  # What a release publishes is built by the two jobs below and published by
  # the one after them (spec 079). Tests, the linter and the fuzzer run code
  # the release does not ship, and the jobs above may share a cache; neither
  # reaches what people install. These two run no tests, read no cache, keep
  # no token and can write nothing.
  #
  # Go comes from go.dev, the newest patch of the line by go.dev's own list,
  # rather than through the manifest setup-go otherwise reads from a branch of
  # another repository. The release takes each job's artifact by the ID the job
  # reported, not by a name another job could reuse.
  build-linux:
    name: Build the Linux release
    needs: [test, fuzz, windows, bpf-rebuilt]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          go-download-base-url: https://go.dev/dl
          cache: false

      - name: Install the window's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      # VERSION is the version of record. A tag that disagrees with it is a
      # release nobody can reason about afterwards, so it fails here rather
      # than shipping.
      - name: Check the tag matches VERSION
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Build the release tarball
        run: make release

      # A build off the tag, or from a modified tree, says `-dev` (Makefile,
      # BUILD_VERSION). A release that said it would be a release nobody
      # could tell from a desk's own build, so it fails here.
      - name: The release says its own version
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          ./hayami-tui --version | grep -Fx "hayami-tui version $v"

      # After the tarball, because `make release` empties dist/.
      - name: Build the Linux installers
        run: |
          make installer
          v="$(tr -d '[:space:]' < VERSION)"
          "dist/hayami-$v-linux-amd64-cli-installer" --version | grep -F "hayami $v installer"
          "dist/hayami-$v-linux-amd64-installer" --version | grep -F "hayami $v installer"

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hayami-linux-release
          path: |
            dist/*.tar.gz
            dist/*-linux-amd64-installer
            dist/*-linux-amd64-cli-installer
          if-no-files-found: error

  build-windows:
    name: Build the Windows release
    needs: [test, fuzz, windows, bpf-rebuilt]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          go-download-base-url: https://go.dev/dl
          cache: false

      - name: Install fynstall, at the version go.mod requires
        shell: bash
        run: go install "github.com/ushineko/fynstall/cmd/fynstall@$(go list -m -f '{{.Version}}' github.com/ushineko/fynstall)"

      # The script builds both panels with the version stamped in, as it does
      # on a desk, and the installers around them.
      - name: Build the installers
        shell: pwsh
        run: ./scripts/installer_windows.ps1 -Fynstall (Join-Path (go env GOPATH) "bin\fynstall.exe") -Windowed -WithCliOnly

      # What the installers carry was built by install_windows.ps1, which
      # says `-dev` off the tag or from a modified tree (Get-BuildVersion).
      # A release that said it would ship a desk's build, so it fails here.
      - name: The release says its own version
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          ./hayami-tui.exe --version | tr -d '\r' | grep -Fx "hayami-tui version $v"

      - name: The installers run
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          "dist/hayami-$v-windows-amd64-cli-installer.exe" --version | grep -F "hayami $v installer"
          "dist/hayami-$v-windows-amd64-cli-installer.exe" --dry-run --yes
          "dist/hayami-$v-windows-amd64-installer.exe" --version | grep -F "hayami $v installer"

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hayami-windows-installers
          path: |
            dist/*-windows-amd64-installer.exe
            dist/*-windows-amd64-cli-installer.exe
          if-no-files-found: error

  # The Release is published here and never by hand. Pushing a v* tag is the
  # whole of the ceremony: the jobs above build what it carries, and this one
  # signs and attaches it.
  #
  # This job holds the only write rights in the workflow, so it runs nothing
  # from the repository or its modules: no Go, no make, no program it built.
  # tests/structure/release_workflow_test.go holds it to that.
  #
  # Linux amd64 and Windows amd64, for now. The desktop panel links against
  # the system's OpenGL and X11 or Wayland libraries, so another target means
  # a cross toolchain for each, and hayami is still experimental enough that
  # the AUR and the other architectures are a later problem.
  release:
    name: Release
    needs: [test, fuzz, windows, bpf-rebuilt, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Writes the release; id-token and attestations sign what it publishes.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # For README.md and for main's history. Read as data; nothing in it runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is a commit on main. This catches a tag pushed from the wrong
      # place; it does not stop a stolen token, which can put a commit on main
      # or tag from a workflow without this step. The ref is spelled out, since
      # a tag named origin/main would otherwise win. A tag with a suffix is a
      # pre-release, which may be tried from a branch.
      - name: A release is a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) echo "pre-release $TAG: not required to be on main" ;;
            *) git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main \
                 || { echo "$TAG names a commit that is not on main"; exit 1; } ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-windows.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        run: |
          cd dist
          ls -l
          sha256sum *.tar.gz *.exe *-linux-amd64-installer *-linux-amd64-cli-installer > SHA256SUMS
          cat SHA256SUMS

      # The notes are this version's changelog entry, not a list of commit
      # subjects: the entry is written for somebody deciding whether to
      # upgrade, the commit list for somebody who already has the diff.
      # GitHub's generated notes are kept underneath, so the "Full Changelog"
      # link still appears. The job fails when the entry is missing, which is
      # the check that the changelog was written before the tag was pushed.
      - name: Take the release notes from the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "### " v) == 1 { f = 1; next }
            f && /^### / { exit }
            f { print }
          ' README.md > dist/NOTES.md
          test -s dist/NOTES.md || { echo "no changelog entry for $ver in README.md"; exit 1; }
          echo "--- notes ---"; cat dist/NOTES.md

      # Build provenance for every file the release publishes: signed by
      # GitHub for this workflow, this repository and this commit, and
      # checked with `gh attestation verify <file> -R ushineko/hayami`
      # (spec 075). SHA256SUMS says a download is whole; this says who built
      # it. Before the release, so a failure here publishes nothing.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.exe
            dist/*-linux-amd64-installer
            dist/*-linux-amd64-cli-installer
            dist/SHA256SUMS

      # gh creates a draft, uploads to it and publishes it, so this works with
      # immutable releases on, removes the draft if an upload fails and refuses
      # a release that already exists. A tag with a suffix (v0.11.14-rc.1) is a
      # pre-release: published for testing, never the release a download link
      # calls latest. GitHub's generated notes go under the changelog entry, so
      # the "Full Changelog" link still appears.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) kind="--prerelease --latest=false" ;;
            *) kind="--latest" ;;
          esac
          # shellcheck disable=SC2086 # $kind is one or two flags
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file dist/NOTES.md --generate-notes $kind \
            dist/*.tar.gz dist/*.exe dist/*-linux-amd64-installer \
            dist/*-linux-amd64-cli-installer dist/SHA256SUMS
